# Render configuration for the ADU research scraper.
#
# Free-tier note: Render's free plan does NOT support Background Workers or
# built-in cron jobs, so the scraper's 10-minute watchdog runs INSIDE the Web
# Service process (src/server.ts calls startAduWatchdog() after the API boots).
# No worker service is defined here.
#
# Env vars to set on the Web Service (Render dashboard → Environment):
#   - DATABASE_URL               (same as local server/.env, sslmode=require)
#   - ADU_CRON_SCHEDULE          optional, default "*/10 * * * *"
#   - ADU_CRON_TIMEZONE          optional, default "Africa/Lagos"
#   - OXYLABS_USERNAME / OXYLABS_PASSWORD
#   - SPREADSHEET_ID
#   - GOOGLE_SERVICE_ACCOUNT_KEY_PATH
#   - CREXI_PROXY_URL
#   - INVESTORLIFT_SESSION_FILE  (path to a mounted investorlift-session.json)
#
# Caveat: free-tier Web Services sleep after ~15 min without traffic, which
# pauses the cron while asleep. Add a free uptime pinger (e.g. UptimeRobot,
# cron-job.org) hitting your primary URL every ~5 min to keep it awake.
services: []